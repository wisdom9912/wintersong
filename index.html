<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter from THE BOYZ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url(https://cur.cursors-4u.net/holidays/hol-4/hol361.ani), url(https://cur.cursors-4u.net/holidays/hol-4/hol361.png), auto !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* 눈 내리는 애니메이션 */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) translateX(var(--drift));
            }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
            font-weight: 300;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        .tv-card {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 50px;
            position: relative;
        }

        .tv-card iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls-container {
            display: flex;
            gap: 15px;
            width: 65%;
            justify-content: center;
            margin: 0 auto;
        }

        .random-button {
            width: 60px;
            height: 60px;
            padding: 0;
            font-size: 1.5em;
            font-weight: normal;
            color: #E75A5A;
            background: #E75A5A;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .random-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .random-button:hover::before {
            opacity: 1;
            animation: christmasLight 1.5s ease-in-out infinite;
        }

        .random-button span {
            position: relative;
            z-index: 1;
            color: #151A2A;
        }

        @keyframes christmasLight {
            0%, 33.33% {
                background-color: #4CAF50;
            }
            33.34%, 66.66% {
                background-color: #F44336;
            }
            66.67%, 100% {
                background-color: #FFD700;
            }
        }

        .random-button:active {
            transform: scale(0.95);
        }

        /* 하트 클릭 애니메이션 */
        .random-button span.heart-click {
            animation: heartClick 0.5s ease-out;
        }

        @keyframes heartClick {
            0% {
                transform: scale(1);
                color: white;
            }
            30% {
                transform: scale(1.4);
                color: #FF0000;
            }
            60% {
                transform: scale(1.2);
                color: #FF3333;
            }
            100% {
                transform: scale(1);
                color: white;
            }
        }

        /* 불꽃놀이 파티클 */
        .firework-particle {
            position: fixed;
            font-size: 16px;
            pointer-events: none;
            z-index: 1000;
            animation: firework 1s ease-out forwards;
            line-height: 1;
        }

        @keyframes firework {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg);
                opacity: 0;
            }
        }

        .title-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid white;
            border-radius: 10px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            min-height: 60px;
        }

        .title-text {
            font-size: 1.3em;
            color: #333;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 0.8em;
                white-space: normal;
            }

            .controls-container {
                flex-direction: column;
                width: 90%;
            }

            .random-button {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

        // 눈송이 생성 함수
        function createSnowflakes() {
            const snowContainer = document.getElementById('snowContainer');
            const snowflakeCount = 50; // 눈송이 개수

            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                
                // 랜덤 위치
                snowflake.style.left = Math.random() * 100 + '%';
                
                // 랜덤 크기 (2px ~ 4px)
                const size = 2 + Math.random() * 2;
                snowflake.style.width = size + 'px';
                snowflake.style.height = size + 'px';
                
                // 더 느린 속도 (40초 ~ 60초)
                const duration = 40 + Math.random() * 20;
                snowflake.style.animationDuration = duration + 's';
                
                // 랜덤 지연 시간
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                
                // 투명도 조절
                snowflake.style.opacity = 0.5 + Math.random() * 0.5;
                
                // 대각선으로 떨어지도록 좌우 이동량 설정 (양수/음수 랜덤)
                const drift = (Math.random() - 0.5) * 200; // -100px ~ 100px 범위
                snowflake.style.setProperty('--drift', drift + 'px');
                
                snowContainer.appendChild(snowflake);
            }
        }

        // 페이지 로드 시 눈송이 생성
        window.addEventListener('DOMContentLoaded', createSnowflakes);

        function playRandomVideo(event) {
            const button = event.currentTarget;
            const heartSpan = button.querySelector('span');
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // 하트 클릭 애니메이션
            heartSpan.classList.remove('heart-click');
            void heartSpan.offsetWidth; // 리플로우 강제
            heartSpan.classList.add('heart-click');
            
            // 애니메이션 종료 후 클래스 제거
            setTimeout(() => {
                heartSpan.classList.remove('heart-click');
            }, 500);
            
            // 불꽃놀이 효과
            createFireworks(centerX, centerY);
            
            const randomIndex = Math.floor(Math.random() * videos.length);
            const selectedVideo = videos[randomIndex];
            
            // TV 카드에 영상 삽입
            const tvCard = document.getElementById('tvCard');
            tvCard.innerHTML = selectedVideo.embed;
            
            // 제목 카드에 제목 표시
            const titleText = document.getElementById('titleText');
            titleText.innerHTML = selectedVideo.title;
        }

        function createFireworks(x, y) {
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.textContent = '★';
                
                // 금색으로 통일
                particle.style.color = '#FFD700';
                
                // 랜덤 방향과 거리
                const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.5;
                const velocity = 80 + Math.random() * 60;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                // 랜덤 애니메이션 지속 시간
                const duration = 0.8 + Math.random() * 0.4;
                particle.style.animationDuration = duration + 's';
                
                document.body.appendChild(particle);
                
                // 애니메이션 종료 후 제거
                setTimeout(() => {
                    particle.remove();
                }, duration * 1000);
            }
        }

    <script type="text/javascript">
        // <![CDATA[
        var colour="rgba(255, 255, 255, 0.7)"; // 투명도 있는 흰색
        var sparkles=50;

        /****************************
        *  Tinkerbell Magic Sparkle *
        *(c)2005-13 mf2fm web-design*
        *  http://www.mf2fm.com/rv  *
        * DON'T EDIT BELOW THIS BOX *
        ****************************/
        var x=ox=400;
        var y=oy=300;
        var swide=800;
        var shigh=600;
        var sleft=sdown=0;
        var tiny=new Array();
        var star=new Array();
        var starv=new Array();
        var starx=new Array();
        var stary=new Array();
        var tinyx=new Array();
        var tinyy=new Array();
        var tinyv=new Array();

        window.onload=function() { if (document.getElementById) {
          var i, rats, rlef, rdow;
          for (var i=0; i<sparkles; i++) {
            var rats=createDiv(3, 3);
            rats.style.visibility="hidden";
            rats.style.zIndex="1000"; // 마우스 이펙트는 최상위
            document.body.appendChild(tiny[i]=rats);
            starv[i]=0;
            tinyv[i]=0;
            var rats=createDiv(5, 5);
            rats.style.backgroundColor="transparent";
            rats.style.visibility="hidden";
            rats.style.zIndex="1000"; // 마우스 이펙트는 최상위
            var rlef=createDiv(1, 5);
            var rdow=createDiv(5, 1);
            rats.appendChild(rlef);
            rats.appendChild(rdow);
            rlef.style.top="2px";
            rlef.style.left="0px";
            rdow.style.top="0px";
            rdow.style.left="2px";
            document.body.appendChild(star[i]=rats);
          }
          set_width();
          sparkle();
        }}

        function sparkle() {
          var c;
          if (Math.abs(x-ox)>1 || Math.abs(y-oy)>1) {
            ox=x;
            oy=y;
            for (c=0; c<sparkles; c++) if (!starv[c]) {
              star[c].style.left=(starx[c]=x)+"px";
              star[c].style.top=(stary[c]=y+1)+"px";
              star[c].style.clip="rect(0px, 5px, 5px, 0px)";
              star[c].childNodes[0].style.backgroundColor=star[c].childNodes[1].style.backgroundColor=colour;
              star[c].style.visibility="visible";
              starv[c]=50;
              break;
            }
          }
          for (c=0; c<sparkles; c++) {
            if (starv[c]) update_star(c);
            if (tinyv[c]) update_tiny(c);
          }
          setTimeout("sparkle()", 40);
        }

        function update_star(i) {
          if (--starv[i]==25) star[i].style.clip="rect(1px, 4px, 4px, 1px)";
          if (starv[i]) {
            stary[i]+=1+Math.random()*3;
            starx[i]+=(i%5-2)/5;
            if (stary[i]<shigh+sdown) {
              star[i].style.top=stary[i]+"px";
              star[i].style.left=starx[i]+"px";
            }
            else {
              star[i].style.visibility="hidden";
              starv[i]=0;
              return;
            }
          }
          else {
            tinyv[i]=50;
            tiny[i].style.top=(tinyy[i]=stary[i])+"px";
            tiny[i].style.left=(tinyx[i]=starx[i])+"px";
            tiny[i].style.width="2px";
            tiny[i].style.height="2px";
            tiny[i].style.backgroundColor=star[i].childNodes[0].style.backgroundColor;
            star[i].style.visibility="hidden";
            tiny[i].style.visibility="visible"
          }
        }

        function update_tiny(i) {
          if (--tinyv[i]==25) {
            tiny[i].style.width="1px";
            tiny[i].style.height="1px";
          }
          if (tinyv[i]) {
            tinyy[i]+=1+Math.random()*3;
            tinyx[i]+=(i%5-2)/5;
            if (tinyy[i]<shigh+sdown) {
              tiny[i].style.top=tinyy[i]+"px";
              tiny[i].style.left=tinyx[i]+"px";
            }
            else {
              tiny[i].style.visibility="hidden";
              tinyv[i]=0;
              return;
            }
          }
          else tiny[i].style.visibility="hidden";
        }

        document.onmousemove=mouse;
        function mouse(e) {
          if (e) {
            y=e.pageY;
            x=e.pageX;
          }
          else {
            set_scroll();
            y=event.y+sdown;
            x=event.x+sleft;
          }
        }

        window.onscroll=set_scroll;
        function set_scroll() {
          if (typeof(self.pageYOffset)=='number') {
            sdown=self.pageYOffset;
            sleft=self.pageXOffset;
          }
          else if (document.body && (document.body.scrollTop || document.body.scrollLeft)) {
            sdown=document.body.scrollTop;
            sleft=document.body.scrollLeft;
          }
          else if (document.documentElement && (document.documentElement.scrollTop || document.documentElement.scrollLeft)) {
            sleft=document.documentElement.scrollLeft;
            sdown=document.documentElement.scrollTop;
          }
          else {
            sdown=0;
            sleft=0;
          }
        }

        window.onresize=set_width;
        function set_width() {
          var sw_min=999999;
          var sh_min=999999;
          if (document.documentElement && document.documentElement.clientWidth) {
            if (document.documentElement.clientWidth>0) sw_min=document.documentElement.clientWidth;
            if (document.documentElement.clientHeight>0) sh_min=document.documentElement.clientHeight;
          }
          if (typeof(self.innerWidth)=='number' && self.innerWidth) {
            if (self.innerWidth>0 && self.innerWidth<sw_min) sw_min=self.innerWidth;
            if (self.innerHeight>0 && self.innerHeight<sh_min) sh_min=self.innerHeight;
          }
          if (document.body.clientWidth) {
            if (document.body.clientWidth>0 && document.body.clientWidth<sw_min) sw_min=document.body.clientWidth;
            if (document.body.clientHeight>0 && document.body.clientHeight<sh_min) sh_min=document.body.clientHeight;
          }
          if (sw_min==999999 || sh_min==999999) {
            sw_min=800;
            sh_min=600;
          }
          swide=sw_min;
          shigh=sh_min;
        }

        function createDiv(height, width) {
          var div=document.createElement("div");
          div.style.position="absolute";
          div.style.height=height+"px";
          div.style.width=width+"px";
          div.style.overflow="hidden";
          return (div);
        }
